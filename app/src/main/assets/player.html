<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #p { position: absolute; inset: 0; width: 100%; height: 100%; }
  iframe { border: 0; }
</style>
</head>
<body>
<div id="p"></div>
<script>
  // Keep the page looking "visible" so playback is not paused when the app is in the background.
  try {
    Object.defineProperty(document, 'hidden', { get: function () { return false; } });
    Object.defineProperty(document, 'visibilityState', { get: function () { return 'visible'; } });
    document.addEventListener('visibilitychange', function (e) { e.stopImmediatePropagation(); }, true);
  } catch (e) {}

  var player = null, ready = false, pending = null, timer = null;

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('p', {
      width: '100%',
      height: '100%',
      playerVars: {
        playsinline: 1, rel: 0, fs: 1, autoplay: 0,
        origin: location.origin, widget_referrer: location.origin
      },
      events: {
        onReady: function () {
          ready = true;
          if (pending) { var p = pending; pending = null; load(p.id, p.start, p.autoplay); }
          Android.onReady();
        },
        onStateChange: function (e) {
          Android.onState(e.data, cur(), dur());
          if (e.data === 1) startTimer(); else stopTimer();
        },
        onError: function (e) { Android.onError(e.data); }
      }
    });
  }

  function cur() { try { return player.getCurrentTime() || 0; } catch (e) { return 0; } }
  function dur() { try { return player.getDuration() || 0; } catch (e) { return 0; } }
  function startTimer() { stopTimer(); timer = setInterval(function () { Android.onProgress(cur(), dur()); }, 3000); }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  function load(id, start, autoplay) {
    if (!ready) { pending = { id: id, start: start, autoplay: autoplay }; return; }
    if (autoplay) player.loadVideoById({ videoId: id, startSeconds: start });
    else player.cueVideoById({ videoId: id, startSeconds: start });
  }
  function play() { if (ready) player.playVideo(); }
  function pause() { if (ready) player.pauseVideo(); }
  function stopVideo() { if (ready) player.stopVideo(); }
  function seekBy(s) { if (ready) player.seekTo(Math.max(0, cur() + s), true); }
  function seekTo(s) { if (ready) player.seekTo(Math.max(0, s), true); }
</script>
</body>
</html>
